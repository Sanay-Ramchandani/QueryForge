name: Python tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install with development and web dependencies
        run: python -m pip install -e '.[dev,web]'
      - name: Test
        run: python -m pytest -q
      - name: Command-line smoke test
        run: python -m queryforge ask 'top 5 companies by revenue in 2024'
